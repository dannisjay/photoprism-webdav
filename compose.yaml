# PhotoPrism Local v1.0（改版）
# 用法（在工程根目录）:  docker compose up -d --build
# 所有配置集中在 .env（WEBDAV_* 即你的 Alist WebDAV 信息）
name: photoprism115

services:
  photoprism:
    build:
      context: ./docker
    image: photoprism-115:1.0
    restart: unless-stopped
    # FUSE 挂载需要 /dev/fuse + SYS_ADMIN；自用服务器用 privileged 最简单。
    privileged: true
    # 更小权限替代（内核需支持，任选其一）：
    # devices: ["/dev/fuse"]
    # cap_add: ["SYS_ADMIN"]
    # security_opt: ["apparmor:unconfined"]
    ports:
      - "2342:2342"
    environment:
      # ---- WebDAV 源（你的 Alist）----
      WEBDAV_URL: "${WEBDAV_URL}"
      WEBDAV_USER: "${WEBDAV_USER}"
      WEBDAV_PASS: "${WEBDAV_PASS}"
      # 多目录： 远程路径:挂载名;远程路径:挂载名 （兼容旧变量 WEBDAV_PATH）
      WEBDAV_MOUNTS: "${WEBDAV_MOUNTS:-}"
      # ---- rclone 容错/缓存（可覆盖）----
      RCLONE_VFS_CACHE: "${RCLONE_VFS_CACHE:-true}"
      RCLONE_VFS_CACHE_MAX_SIZE: "${RCLONE_VFS_CACHE_MAX_SIZE:-50G}"
      RCLONE_CONTIMEOUT: "${RCLONE_CONTIMEOUT:-10s}"
      RCLONE_TIMEOUT: "${RCLONE_TIMEOUT:-5m}"
      RCLONE_RETRIES: "${RCLONE_RETRIES:-3}"
      RCLONE_LOW_LEVEL_RETRIES: "${RCLONE_LOW_LEVEL_RETRIES:-20}"
      # ---- PhotoPrism ----
      PHOTOPRISM_SITE_URL: "${PHOTOPRISM_SITE_URL:-http://localhost:2342/}"
      PHOTOPRISM_ADMIN_PASSWORD: "${PHOTOPRISM_ADMIN_PASSWORD}"
      PHOTOPRISM_READONLY: "true"
      PHOTOPRISM_ORIGINALS_PATH: "/photoprism/originals"
      PHOTOPRISM_STORAGE_PATH: "/photoprism/storage"
      PHOTOPRISM_DISABLE_WEBDAV: "true"
      PHOTOPRISM_DATABASE_DRIVER: "mysql"
      PHOTOPRISM_DATABASE_DSN: "photoprism:${MARIADB_PASSWORD}@tcp(mariadb:3306)/photoprism?charset=utf8mb4,utf8&parseTime=true&loc=Local"
    volumes:
      # 本地盘：缩略图/原图缓存(rclone-vfs)/侧车/索引缓存，必须服务器本地磁盘
      - "./storage:/photoprism/storage"
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_AUTO_UPGRADE: "1"
      MARIADB_DATABASE: "photoprism"
      MARIADB_USER: "photoprism"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD}"
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
    volumes:
      - "./database:/var/lib/mysql"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10